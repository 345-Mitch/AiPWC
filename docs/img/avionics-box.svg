lated charger</text><rect x='343' y='410' width='250' height='138' rx='8' fill='#fff' stroke='#d97706' stroke-width='3'/><rect x='343' y='410' width='250' height='10' rx='4' fill='#d97706'/><text x='468.0' y='483.0' font-size='17' fill='#0f172a' text-anchor='middle' font-weight='bold'>Orion-Tr 12/24</text><text x='468.0' y='505.0' font-size='13' fill='#64748b' text-anchor='middle' font-weight='normal'>actuator supply</text><rect x='608' y='410' width='200' height='138' rx='8' fill='#fff' stroke='#d97706' stroke-width='3'/><rect x='608' y='410' width='200' height='10' rx='4' fill='#d97706'/><text x='708.0' y='483.0' font-size='17' fill='#0f172a' text-anchor='middle' font-weight='bold'>12→5 V × 2</text><text x='708.0' y='505.0' font-size='13' fill='#64748b' text-anchor='middle' font-weight='normal'>Cube + companion</text><rect x='823' y='410' width='300' height='138' rx='8' fill='#fff' stroke='#d97706' stroke-width='3'/><rect x='823' y='410' width='300' height='10' rx='4' fill='#d97706'/><text x='973.0' y='483.0' font-size='17' fill='#0f172a' text-anchor='middle' font-weight='bold'>Fuse block + TVS</text><text x='973.0' y='505.0' font-size='13' fill='#64748b' text-anchor='middle' font-weight='normal'>one fuse per load</text><text x='203' y='380' font-size='12' fill='#2563eb' text-anchor='middle' font-weight='normal'>arrow on Cube points to bow →</text><rect x='98' y='586' width='40' height='22' rx='4' fill='#d97706'/><text x='118' y='630' font-size='13' fill='#0f172a' text-anchor='middle' font-weight='normal'>12 V in</text><rect x='218.5' y='586' width='40' height='22' rx='4' fill='#d97706'/><text x='238.5' y='630' font-size='13' fill='#0f172a' text-anchor='middle' font-weight='normal'>24 V out</text><rect x='339.0' y='586' width='40' height='22' rx='4' fill='#2563eb'/><text x='359.0' y='630' font-size='13' fill='#0f172a' text-anchor='middle' font-weight='normal'>CAN: craft</text><rect x='459.5' y='586' width='40' height='22' rx='4' fill='#2563eb'/><text x='479.5' y='